        updated: {type: integer, minimum: 0}
        invalidRows: {type: integer, minimum: 0}
        errors: {type: array, items: {$ref: '#/components/schemas/EmploymentImportError'}}
        metrics: {$ref: '#/components/schemas/EmploymentImportMetrics'}
